<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ka-ching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #E2EBE4;
    --bg-2: #CFDDD3;
    --brass: #8A6A12;
    --brass-hi: #B8901F;
    --paper: #FFFDF6;
    --ink: #1E1B16;
    --text: #13291F;
    --muted: #4C6658;
    --line: rgba(19, 41, 31, .18);
    --red: #A3301F;
    --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
    --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0F2A21;
      --bg-2: #17392D;
      --brass: #D4AF37;
      --brass-hi: #F0CF5E;
      --paper: #F1EBDA;
      --ink: #1E1B16;
      --text: #EDE6D3;
      --muted: #93AD9F;
      --line: rgba(237, 230, 211, .16);
      --red: #E8735E;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 3px; }

  /* ---------- layout ---------- */
  .stage {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr minmax(240px, 26vw);
    gap: clamp(16px, 3vw, 48px);
    padding: clamp(16px, 3vw, 48px);
  }
  .main { display: flex; flex-direction: column; min-width: 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .status { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: clamp(13px, 1.1vw, 16px); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .status[data-state="live"] .dot { background: #3FBF7F; box-shadow: 0 0 0 0 rgba(63,191,127,.6); animation: pulse 2.4s infinite; }
  .status[data-state="reconnecting"] .dot, .status[data-state="connecting"] .dot { background: var(--brass); }
  .status[data-state="setup"] .dot { background: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63,191,127,.55); } 70% { box-shadow: 0 0 0 10px rgba(63,191,127,0); } 100% { box-shadow: 0 0 0 0 rgba(63,191,127,0); } }

  .controls { display: flex; gap: 8px; transition: opacity .4s; }
  body.idle .controls { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--line); }
  .icon-btn svg { width: 20px; height: 20px; }

  .today { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-height: 0; }
  .today-label { font-family: var(--display); font-weight: 600; font-size: clamp(20px, 2.4vw, 40px); color: var(--muted); letter-spacing: .02em; margin: 0 0 .2em; }
  .total {
    font-family: var(--display); font-weight: 900; line-height: .86;
    font-size: clamp(64px, 14vw, 260px);
    color: var(--brass); letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .count { margin-top: .6em; font-size: clamp(16px, 1.8vw, 30px); color: var(--text); }
  .count strong { font-family: var(--display); font-weight: 800; font-size: 1.4em; color: var(--brass-hi); margin-right: .15em; }

  /* ---------- receipt roll ---------- */
  .roll {
    align-self: start;
    max-height: 100%;
    background: var(--paper); color: var(--ink);
    padding: 22px 20px 34px;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-mask: linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/16px 12px repeat-x;
    mask: linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/16px 12px repeat-x;
  }
  .roll h2 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 0 0 4px; letter-spacing: .03em; }
  .roll .sub { font-size: 13px; color: #6B6457; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 2px dashed #CFC6B2; }
  .roll ol { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .roll li {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline;
    padding: 8px 0; border-bottom: 1px dotted #D8D0BE; font-size: clamp(14px, 1.15vw, 18px);
  }
  .roll li.fresh { animation: print .6s ease-out; }
  @keyframes print { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .roll .time { color: #6B6457; }
  .roll .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #4A443A; }
  .roll .amt { font-weight: 600; }
  .roll .amt.neg { color: #A3301F; }
  .roll .empty { color: #6B6457; font-size: 15px; line-height: 1.5; padding: 6px 0; }

  /* ---------- celebration ---------- */
  .burst {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 20;
  }
  .burst.on { opacity: 1; }
  .register {
    background: linear-gradient(var(--brass-hi), var(--brass));
    padding: clamp(10px, 1.4vw, 20px);
    border-radius: 14px 14px 6px 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35);
    position: relative; z-index: 2;
  }
  .window {
    background: #0B1A14; border-radius: 6px;
    padding: clamp(10px, 1.4vw, 20px) clamp(12px, 1.8vw, 26px);
    display: flex; gap: clamp(4px, .5vw, 8px); overflow: hidden;
    box-shadow: inset 0 6px 18px rgba(0,0,0,.6);
  }
  .tab {
    font-family: var(--display); font-weight: 900; color: var(--ink);
    background: linear-gradient(#FFFFFF, var(--paper) 55%, #E3DBC6);
    font-size: clamp(56px, 12vw, 220px); line-height: 1;
    min-width: .62em; text-align: center; padding: .06em .08em 0;
    border-radius: 4px;
    transform: translateY(110%);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
  }
  .tab.sym { min-width: auto; padding-inline: .1em; }
  .tab.gap { background: transparent; box-shadow: none; min-width: .2em; }
  .burst.on .tab { animation: popup .55s cubic-bezier(.2, 1.6, .4, 1) forwards; animation-delay: calc(var(--i) * 55ms); }
  @keyframes popup { to { transform: translateY(0); } }
  .burst-label {
    position: absolute; left: 0; right: 0; bottom: 14vh; text-align: center;
    font-size: clamp(18px, 2.2vw, 36px); color: var(--text); z-index: 2;
    opacity: 0; transition: opacity .4s .5s;
  }
  .burst.on .burst-label { opacity: 1; }
  canvas#coins { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 21; }

  /* ---------- start gate ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center;
    background: var(--bg); padding: 24px; cursor: pointer;
  }
  .gate h1 { font-family: var(--display); font-weight: 900; font-size: clamp(56px, 10vw, 150px); color: var(--brass); margin: 0; line-height: .9; }
  .gate p { color: var(--muted); font-size: clamp(16px, 1.6vw, 22px); max-width: 34ch; margin: 18px auto 28px; line-height: 1.45; }
  .gate .start {
    border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer;
    background: var(--brass); color: #10241B; font-weight: 600; font-size: 18px;
  }
  .gate[hidden] { display: none; }

  /* ---------- settings ---------- */
  dialog {
    border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 32px));
    background: var(--paper); color: var(--ink); box-shadow: 0 40px 80px rgba(0,0,0,.4);
  }
  dialog::backdrop { background: rgba(5, 15, 11, .6); }
  dialog form { padding: 28px; display: grid; gap: 18px; max-height: calc(100vh - 40px); overflow: auto; }
  dialog h2 { font-family: var(--display); font-weight: 800; font-size: 32px; margin: 0; }
  .field { display: grid; gap: 6px; }
  .field > span { font-weight: 600; font-size: 15px; }
  .field .hint { font-size: 13px; color: #6B6457; line-height: 1.4; margin: 0; }
  .field input[type="text"], .field input[type="number"] {
    border: 1px solid #CFC6B2; border-radius: 8px; padding: 10px 12px; background: #fff; color: var(--ink); width: 100%;
  }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .check { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .check input { width: 20px; height: 20px; accent-color: #8A6A12; }
  .btn { border: 1px solid #CFC6B2; background: #fff; color: var(--ink); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: #F4EFE2; }
  .btn.primary { background: #8A6A12; border-color: #8A6A12; color: #fff; }
  .btn.primary:hover { background: #745910; }
  .btn.danger { color: #A3301F; }
  .hook { background: #F4EFE2; border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
  .hook code { font-size: 13px; word-break: break-all; color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
  .actions .left { display: flex; gap: 8px; flex-wrap: wrap; }
  .error { color: #A3301F; font-size: 13px; margin: 0; min-height: 1em; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .stage { grid-template-columns: 1fr; height: auto; min-height: 100%; }
    .today { padding: 8vh 0; }
    .two { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .burst.on .tab { animation: none; transform: none; }
    .roll li.fresh { animation: none; }
    .status[data-state="live"] .dot { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <main class="main">
      <div class="topbar">
        <div class="status" id="status" data-state="setup" role="status" aria-live="polite">
          <span class="dot"></span><span id="statusText">Not set up</span>
        </div>
        <div class="controls">
          <button class="icon-btn" id="fsBtn" aria-label="Full screen" title="Full screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
      </div>

      <section class="today" aria-label="Today’s sales">
        <p class="today-label">Today</p>
        <div class="total" id="total">€0.00</div>
        <div class="count" id="count"><strong>0</strong> sales</div>
      </section>
    </main>

    <aside class="roll" aria-label="Recent sales">
      <h2>Till roll</h2>
      <p class="sub" id="rollDate"></p>
      <ol id="rollList"></ol>
    </aside>
  </div>

  <div class="burst" id="burst" aria-live="assertive">
    <div class="register"><div class="window" id="window"></div></div>
    <div class="burst-label" id="burstLabel"></div>
  </div>
  <canvas id="coins"></canvas>

  <div class="gate" id="gate">
    <div>
      <h1>Ka-ching</h1>
      <p>Browsers only play sound after a tap. Start the display once and leave it running.</p>
      <button class="start" id="startBtn">Start display</button>
    </div>
  </div>

  <dialog id="settings">
    <form method="dialog" id="form" novalidate>
      <h2>Display settings</h2>

      <label class="field">
        <span>ntfy topic</span>
        <div class="row">
          <input type="text" name="topic" autocomplete="off" spellcheck="false" placeholder="e.g. kaching-x7f2q9…">
          <button type="button" class="btn" id="genBtn">Generate</button>
        </div>
        <p class="hint">Keep it long and random. Anyone who knows the topic can see your sales and send fake ones.</p>
      </label>

      <div class="two">
        <label class="field">
          <span>Amount field</span>
          <input type="text" name="field" spellcheck="false">
          <p class="hint">The field in the message that holds the amount. Use dots for nested fields.</p>
        </label>
        <label class="field">
          <span>Currency</span>
          <input type="text" name="currency" maxlength="3" spellcheck="false">
          <p class="hint">Used when a message doesn’t include its own currency.</p>
        </label>
      </div>

      <div class="two">
        <label class="field">
          <span>Big sale from</span>
          <input type="number" name="big" min="0" step="any">
          <p class="hint">Sales at or above this get a bigger celebration.</p>
        </label>
        <div class="field">
          <span>Sound</span>
          <label class="check"><input type="checkbox" name="sound"> Play the ka-ching</label>
        </div>
      </div>

      <div class="hook">
        <strong>Webhook URL for PostHog</strong>
        <code id="hookUrl">Set a topic first</code>
        <div class="row"><button type="button" class="btn" id="copyBtn">Copy URL</button></div>
      </div>

      <p class="error" id="formError"></p>

      <div class="actions">
        <div class="left">
          <button type="button" class="btn" id="testBtn">Play a test sale</button>
          <button type="button" class="btn danger" id="resetBtn">Reset today</button>
        </div>
        <button type="submit" class="btn primary" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

<script>
(() => {
  "use strict";

  // ---------- storage ----------
  const LS_CFG = "kaching.cfg.v1";
  const LS_DAY = "kaching.day.v1";
  const load = (k) => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const defaults = { topic: "", field: "amount", currency: "EUR", big: 500, sound: true };
  let cfg = Object.assign({}, defaults, load(LS_CFG) || {});

  // URL parameters override saved settings, so one link can set up any screen.
  const qp = new URLSearchParams(location.search);
  if (qp.get("topic")) cfg.topic = qp.get("topic");
  if (qp.get("field")) cfg.field = qp.get("field");
  if (qp.get("currency")) cfg.currency = qp.get("currency").toUpperCase();
  if (qp.get("big") && isFinite(+qp.get("big"))) cfg.big = +qp.get("big");
  if (qp.get("sound") === "0") cfg.sound = false;
  store(LS_CFG, cfg);

  const TOPIC_RE = /^[A-Za-z0-9_-]{1,64}$/;

  // ---------- day state ----------
  const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  const startOfDay = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const freshDay = () => ({ key: todayKey(), total: 0, count: 0, ids: [], lastId: null, sales: [] });

  let day = load(LS_DAY);
  if (!day || day.key !== todayKey()) day = freshDay();
  const saveDay = () => store(LS_DAY, day);

  let shownTotal = day.total;
  let shownCount = day.count;

  // ---------- formatting ----------
  const fmtCache = {};
  function fmt(v, cur) {
    cur = cur || cfg.currency;
    try {
      fmtCache[cur] = fmtCache[cur] || new Intl.NumberFormat(undefined, { style: "currency", currency: cur });
      return fmtCache[cur].format(v);
    } catch {
      return `${v.toFixed(2)} ${cur}`;
    }
  }
  const fmtTime = (unix) => new Date(unix * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  // ---------- elements ----------
  const $ = (id) => document.getElementById(id);
  const totalEl = $("total"), countEl = $("count"), rollList = $("rollList"), rollDate = $("rollDate");
  const statusEl = $("status"), statusText = $("statusText");
  const burst = $("burst"), windowEl = $("window"), burstLabel = $("burstLabel");
  const gate = $("gate"), dlg = $("settings"), form = $("form");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- rendering ----------
  function renderTotals() {
    totalEl.textContent = fmt(shownTotal);
    countEl.innerHTML = `<strong>${shownCount}</strong> ${shownCount === 1 ? "sale" : "sales"}`;
  }

  let totalAnim = null;
  function animateTotalTo(target, targetCount) {
    cancelAnimationFrame(totalAnim);
    const from = shownTotal, start = performance.now(), dur = reducedMotion ? 0 : 1200;
    shownCount = targetCount;
    const step = (now) => {
      const p = dur ? Math.min(1, (now - start) / dur) : 1;
      const e = 1 - Math.pow(1 - p, 3);
      shownTotal = from + (target - from) * e;
      renderTotals();
      if (p < 1) totalAnim = requestAnimationFrame(step); else { shownTotal = target; renderTotals(); }
    };
    totalAnim = requestAnimationFrame(step);
  }

  function renderRoll(freshFirst) {
    rollDate.textContent = new Date().toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
    if (!day.sales.length) {
      rollList.innerHTML = `<li class="empty" style="display:block">Sales print here as they come in.</li>`;
      return;
    }
    rollList.innerHTML = "";
    day.sales.slice(0, 30).forEach((s, i) => {
      const li = document.createElement("li");
      if (i === 0 && freshFirst) li.className = "fresh";
      const t = document.createElement("span"); t.className = "time"; t.textContent = fmtTime(s.t);
      const l = document.createElement("span"); l.className = "label"; l.textContent = s.label || "";
      const a = document.createElement("span"); a.className = "amt" + (s.amount < 0 ? " neg" : "");
      a.textContent = (s.amount >= 0 ? "+" : "") + fmt(s.amount, s.currency);
      li.append(t, l, a);
      rollList.appendChild(li);
    });
  }

  function setStatus(state) {
    statusEl.dataset.state = state;
    statusText.textContent = {
      setup: "Not set up: open settings",
      connecting: "Connecting…",
      live: "Live",
      reconnecting: "Connection lost, retrying…"
    }[state] || state;
  }

  // ---------- parsing ----------
  const getPath = (o, p) => p.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o);
  function toNum(v) {
    if (typeof v === "number") return v;
    if (typeof v !== "string") return NaN;
    let s = v.trim().replace(/[^\d.,-]/g, "");
    if (!s) return NaN;
    if (s.includes(",") && !s.includes(".")) s = s.replace(",", ".");
    else s = s.replace(/,/g, "");
    return parseFloat(s);
  }
  function parseSale(text) {
    let obj = null;
    try { obj = JSON.parse(text); } catch {}
    let amount, currency, label;
    if (obj && typeof obj === "object") {
      amount = toNum(getPath(obj, cfg.field));
      currency = obj.currency;
      label = obj.label || obj.product || obj.name;
    } else {
      amount = toNum(String(text));
    }
    if (!isFinite(amount)) return null;
    currency = (typeof currency === "string" && /^[A-Za-z]{3}$/.test(currency.trim())) ? currency.trim().toUpperCase() : cfg.currency;
    label = (typeof label === "string" && !/^\{.*\}$/.test(label.trim())) ? label.trim().slice(0, 60) : "";
    return { amount, currency, label };
  }

  // ---------- ntfy connection ----------
  let es = null, retryTimer = null;
  const pageStart = Date.now() / 1000;

  function connect() {
    if (es) { es.close(); es = null; }
    clearTimeout(retryTimer);
    if (!TOPIC_RE.test(cfg.topic)) { setStatus("setup"); return; }
    rollover();
    // Resume after the last message we saw, or pull everything since midnight
    // (ntfy.sh keeps messages for about 12 hours), so a reload doesn't lose sales.
    const since = day.lastId || Math.floor(startOfDay() / 1000);
    setStatus("connecting");
    es = new EventSource(`https://ntfy.sh/${encodeURIComponent(cfg.topic)}/sse?since=${since}`);
    es.onopen = () => setStatus("live");
    es.onmessage = (e) => handle(e.data);
    es.addEventListener("open", () => setStatus("live"));
    es.addEventListener("keepalive", () => setStatus("live"));
    es.onerror = () => {
      setStatus("reconnecting");
      if (es) es.close();
      es = null;
      retryTimer = setTimeout(connect, 4000);
    };
  }

  function handle(raw) {
    let m;
    try { m = JSON.parse(raw); } catch { return; }
    if (m.event !== "message") { if (m.event === "open" || m.event === "keepalive") setStatus("live"); return; }
    rollover();
    if (day.ids.includes(m.id)) return;
    day.ids.push(m.id);
    if (day.ids.length > 3000) day.ids = day.ids.slice(-3000);
    day.lastId = m.id;
    if (m.time * 1000 < startOfDay()) { saveDay(); return; }

    const sale = parseSale(m.message ?? "");
    if (!sale) { saveDay(); return; }

    day.total += sale.amount;
    day.count += 1;
    day.sales.unshift({ t: m.time, amount: sale.amount, currency: sale.currency, label: sale.label });
    day.sales = day.sales.slice(0, 60);
    saveDay();

    const live = m.time >= pageStart - 2;
    if (live) {
      queue.push({ ...sale, total: day.total, count: day.count });
      runQueue();
    } else {
      // Backfilled from earlier today: count it quietly.
      if (!running) animateTotalTo(day.total, day.count);
      renderRoll(false);
    }
  }

  // ---------- celebration queue ----------
  const queue = [];
  let running = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function runQueue() {
    if (running) return;
    running = true;
    while (queue.length) {
      const s = queue.shift();
      const hold = queue.length > 2 ? 2200 : 4200;
      await celebrate(s, hold);
      if (!s.test) { animateTotalTo(s.total, s.count); renderRoll(true); }
      await sleep(400);
    }
    running = false;
    if (Math.abs(shownTotal - day.total) > 1e-9 || shownCount !== day.count) animateTotalTo(day.total, day.count);
  }

  async function celebrate(s, hold) {
    const big = s.amount >= cfg.big;
    const text = (s.amount >= 0 ? "+" : "") + fmt(s.amount, s.currency);
    windowEl.innerHTML = "";
    windowEl.setAttribute("aria-label", text);
    [...text].forEach((ch, i) => {
      const t = document.createElement("span");
      t.className = "tab" + (/\s/.test(ch) ? " gap" : /[\d]/.test(ch) ? "" : " sym");
      t.textContent = /\s/.test(ch) ? "" : ch;
      t.style.setProperty("--i", i);
      t.setAttribute("aria-hidden", "true");
      windowEl.appendChild(t);
    });
    burstLabel.textContent = s.test ? "Test sale" : (s.label || (big ? "Big sale!" : "New sale"));
    void windowEl.offsetWidth;
    burst.classList.add("on");
    kaching(big);
    if (!reducedMotion) coinBurst(big ? 140 : 60);
    await sleep(hold);
    burst.classList.remove("on");
    await sleep(350);
  }

  // ---------- sound (synthesized, no files needed) ----------
  let actx = null;
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }

  function bell(a, out, t, vol, base) {
    [[1, 1], [2.0, .45], [2.76, .35], [5.4, .18], [8.93, .08]].forEach(([r, amp]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sine";
      o.frequency.value = base * r;
      const decay = 1.8 / Math.pow(r, .4);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * amp * .22, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + decay + .05);
    });
  }

  function noise(a, out, t, dur, freq, vol) {
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const n = a.createBufferSource(); n.buffer = buf;
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = .9;
    const g = a.createGain(); g.gain.value = vol;
    n.connect(bp).connect(g).connect(out);
    n.start(t);
  }

  function kaching(big) {
    if (!cfg.sound) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + .03;
    const out = a.createGain(); out.gain.value = .9; out.connect(a.destination);

    // "ka": the drawer lever and thunk
    noise(a, out, t, .07, 2200, .6);
    const o = a.createOscillator(), g = a.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(190, t + .05);
    o.frequency.exponentialRampToValueAtTime(55, t + .2);
    g.gain.setValueAtTime(.55, t + .05);
    g.gain.exponentialRampToValueAtTime(.0001, t + .24);
    o.connect(g).connect(out); o.start(t + .05); o.stop(t + .26);
    noise(a, out, t + .09, .12, 5200, .35);

    // "ching": the bell
    bell(a, out, t + .14, 1, 1760);
    bell(a, out, t + .16, .5, 2637);

    if (big) {
      bell(a, out, t + .55, .9, 1975);
      bell(a, out, t + .57, .5, 2960);
      for (let i = 0; i < 18; i++) {
        const ct = t + .3 + Math.random() * 1.1;
        const co = a.createOscillator(), cg = a.createGain();
        co.type = "sine"; co.frequency.value = 3200 + Math.random() * 3200;
        cg.gain.setValueAtTime(.0001, ct);
        cg.gain.exponentialRampToValueAtTime(.08, ct + .004);
        cg.gain.exponentialRampToValueAtTime(.0001, ct + .18);
        co.connect(cg).connect(out); co.start(ct); co.stop(ct + .2);
      }
    }
  }

  // ---------- coins ----------
  const cv = $("coins"), cx = cv.getContext("2d");
  let coins = [], coinRaf = null;
  function sizeCanvas() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", sizeCanvas); sizeCanvas();

  function coinBurst(n) {
    const w = innerWidth, h = innerHeight, s = Math.max(14, Math.min(w, h) / 34);
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1;
      const v = (8 + Math.random() * 12) * (h / 900);
      coins.push({
        x: w / 2 + (Math.random() - .5) * w * .2, y: h * .55,
        vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
        r: s * (.7 + Math.random() * .6), spin: Math.random() * Math.PI * 2,
        vs: .1 + Math.random() * .25, life: 0
      });
    }
    if (!coinRaf) coinRaf = requestAnimationFrame(drawCoins);
  }

  function drawCoins() {
    const h = innerHeight;
    cx.clearRect(0, 0, innerWidth, h);
    const g = .32 * (h / 900);
    coins = coins.filter((c) => c.y < h + 60 && c.life < 400);
    coins.forEach((c) => {
      c.vy += g; c.x += c.vx; c.y += c.vy; c.spin += c.vs; c.life++;
      const sx = Math.max(.12, Math.abs(Math.cos(c.spin)));
      cx.save();
      cx.translate(c.x, c.y);
      cx.scale(sx, 1);
      const grd = cx.createRadialGradient(-c.r * .3, -c.r * .3, c.r * .1, 0, 0, c.r);
      grd.addColorStop(0, "#FFF1B0"); grd.addColorStop(.55, "#E2B93B"); grd.addColorStop(1, "#9C7414");
      cx.fillStyle = grd;
      cx.beginPath(); cx.arc(0, 0, c.r, 0, Math.PI * 2); cx.fill();
      cx.strokeStyle = "rgba(110, 80, 10, .55)"; cx.lineWidth = Math.max(1, c.r * .12);
      cx.beginPath(); cx.arc(0, 0, c.r * .72, 0, Math.PI * 2); cx.stroke();
      cx.restore();
    });
    if (coins.length) coinRaf = requestAnimationFrame(drawCoins);
    else { coinRaf = null; cx.clearRect(0, 0, innerWidth, h); }
  }

  // ---------- day rollover ----------
  function rollover() {
    if (day.key === todayKey()) return;
    const lastId = day.lastId;
    day = freshDay();
    day.lastId = lastId;
    saveDay();
    shownTotal = 0; shownCount = 0;
    renderTotals(); renderRoll(false);
  }
  setInterval(rollover, 30000);

  // ---------- screen wake lock ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && gate.hidden) keepAwake(); });

  // ---------- idle controls ----------
  let idleTimer;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!dlg.open) document.body.classList.add("idle"); }, 3500);
  }
  ["mousemove", "pointerdown", "keydown", "touchstart"].forEach((ev) => addEventListener(ev, wake, { passive: true }));

  // ---------- settings ----------
  function randomTopic() {
    const abc = "abcdefghijkmnpqrstuvwxyz23456789";
    const bytes = crypto.getRandomValues(new Uint8Array(20));
    return "kaching-" + [...bytes].map((b) => abc[b % abc.length]).join("");
  }
  function updateHook() {
    const t = form.topic.value.trim();
    $("hookUrl").textContent = TOPIC_RE.test(t) ? `https://ntfy.sh/${t}` : "Set a topic first";
  }
  function openSettings() {
    form.topic.value = cfg.topic;
    form.field.value = cfg.field;
    form.currency.value = cfg.currency;
    form.big.value = cfg.big;
    form.sound.checked = cfg.sound;
    $("formError").textContent = "";
    updateHook();
    dlg.showModal();
  }
  form.topic.addEventListener("input", updateHook);
  $("genBtn").addEventListener("click", () => { form.topic.value = randomTopic(); updateHook(); });
  $("copyBtn").addEventListener("click", async () => {
    const t = $("hookUrl").textContent;
    if (!t.startsWith("https://")) return;
    try { await navigator.clipboard.writeText(t); $("copyBtn").textContent = "Copied"; setTimeout(() => ($("copyBtn").textContent = "Copy URL"), 1500); } catch {}
  });
  $("testBtn").addEventListener("click", () => {
    audio();
    const amount = Math.round((20 + Math.random() * 180) * 100) / 100;
    dlg.close();
    queue.push({ amount, currency: form.currency.value.trim().toUpperCase() || cfg.currency, label: "", test: true });
    runQueue();
  });
  $("resetBtn").addEventListener("click", () => {
    if (!confirm("Reset today’s total and the till roll? Sales from ntfy won’t be pulled in again.")) return;
    const lastId = day.lastId, ids = day.ids;
    day = freshDay(); day.lastId = lastId; day.ids = ids;
    saveDay();
    shownTotal = 0; shownCount = 0;
    renderTotals(); renderRoll(false);
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const topic = form.topic.value.trim();
    const currency = form.currency.value.trim().toUpperCase() || "EUR";
    if (!TOPIC_RE.test(topic)) { $("formError").textContent = "Use 1–64 letters, numbers, dashes or underscores for the topic."; return; }
    try { new Intl.NumberFormat(undefined, { style: "currency", currency }); }
    catch { $("formError").textContent = "Use a three-letter currency code, such as EUR or USD."; return; }
    const changedTopic = topic !== cfg.topic;
    cfg = {
      topic,
      field: form.field.value.trim() || "amount",
      currency,
      big: isFinite(+form.big.value) && form.big.value !== "" ? +form.big.value : defaults.big,
      sound: form.sound.checked
    };
    store(LS_CFG, cfg);
    if (changedTopic) { day = freshDay(); saveDay(); shownTotal = 0; shownCount = 0; renderRoll(false); }
    renderTotals();
    dlg.close();
    connect();
  });
  $("settingsBtn").addEventListener("click", openSettings);
  $("fsBtn").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  });

  // ---------- start ----------
  function start() {
    audio();
    gate.hidden = true;
    keepAwake();
    wake();
    if (!TOPIC_RE.test(cfg.topic)) openSettings();
  }
  $("startBtn").addEventListener("click", (e) => { e.stopPropagation(); start(); });
  gate.addEventListener("click", start);

  renderTotals();
  renderRoll(false);
  connect();
})();
</script>
</body>
